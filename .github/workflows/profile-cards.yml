name: Profile summary cards
on:
  schedule:
    - cron: "0 0 * * *"   # cada dia
  workflow_dispatch:       # permet executar-lo a mà

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release   # confirma la versió al README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
